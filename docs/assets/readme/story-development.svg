<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc">
  <title id="title">AI 剧本创作与故事开发</title><desc id="desc">一段故事灵感关联人物关系、分集大纲与分集正文。内容为虚构结构示例，不是系统截图。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b08a97" stroke-width="1.5"/></marker></defs>
  <rect width="1280" height="550" fill="#faf9fa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" letter-spacing="0">
    <text x="48" y="58" font-size="30" font-weight="700" fill="#29282c">先写下故事，再找到它的镜头。</text>
    <text x="48" y="91" font-size="17" fill="#77717a">灵感、人物与分集，不再散落在互不关联的文档里。</text>
    <text x="1232" y="58" text-anchor="end" font-size="19" fill="#92727e">STORY DEVELOPMENT</text>
    <rect x="48" y="136" width="378" height="324" rx="8" fill="#fff" stroke="#e2dce0"/>
    <rect x="48" y="136" width="5" height="324" fill="#aa8292"/>
    <text x="80" y="176" font-size="14" font-weight="600" fill="#92727e">故事设定 / 虚构示例</text>
    <text x="80" y="225" font-size="26" font-weight="700" fill="#29282c">一封迟到的信</text>
    <g font-size="19" fill="#625e65"><text x="80" y="271">她回到离开多年的小镇，</text><text x="80" y="304">收到一封从未寄出的信。</text><text x="80" y="337">重逢，让过去有了新的答案。</text></g>
    <path d="M80 365H393" stroke="#e6e0e3"/>
    <text x="80" y="402" font-size="16" fill="#92727e">核心冲突 · 人物目标 · 世界设定</text>
    <g stroke="#b08a97" stroke-width="1.6" fill="none" marker-end="url(#arrow)"><path d="M426 298H464V191H492"/><path d="M464 298H492"/><path d="M464 298V406H492"/></g>
    <g fill="#fff" stroke="#e2dce0"><rect x="498" y="136" width="734" height="100" rx="8"/><rect x="498" y="249" width="734" height="100" rx="8"/><rect x="498" y="362" width="734" height="98" rx="8"/></g>
    <g font-size="21" font-weight="700" fill="#29282c"><text x="524" y="178">人物关系</text><text x="524" y="291">分集大纲</text><text x="524" y="404">分集正文</text></g>
    <g font-size="17" fill="#77717a"><text x="524" y="209">人物的愿望、阻力与彼此关系</text><text x="524" y="322">故事的推进、转折与每一集的方向</text><text x="524" y="435">从结构走向场景、行动与对白</text></g>
    <g font-size="16" fill="#92727e"><text x="946" y="180">主角 — 旧友 — 家人</text><text x="946" y="293">重逢 → 误会 → 真相</text><text x="946" y="406">场景 / 行动 / 对白</text></g>
    <path d="M48 495H1232" stroke="#e2dce0"/><text x="48" y="528" font-size="14" fill="#77717a">Dralo Studio · 作者决定故事，AI 提供辅助与候选。</text><text x="1232" y="528" text-anchor="end" font-size="14" fill="#958d96">功能结构示意</text>
  </g>
</svg>
